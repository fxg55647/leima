name: PoDe check (reusable)
on:
  workflow_call:

permissions:
  contents: write
  pages: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests irys-sdk

      - name: Run PoDe check
        id: check
        continue-on-error: true
        env:
          RENDER_API_KEY:     ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID:  ${{ secrets.RENDER_SERVICE_ID }}

          GITHUB_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
        run: python pode_check.py

      - name: Upload status to Arweave
        continue-on-error: true
        env:
          IRYS_PRIVATE_KEY: ${{ secrets.IRYS_PRIVATE_KEY }}
          IRYS_NETWORK:     ${{ secrets.IRYS_NETWORK }}
          IRYS_RPC_URL:     ${{ secrets.IRYS_RPC_URL }}
        run: python pode_arweave.py

      - name: Push status.json and log to gh-pages
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          TMPDIR=$(mktemp -d)

          # Clone gh-pages into temp dir, or init fresh if branch doesn't exist yet
          if ! git clone --depth 1 --branch gh-pages "$REPO_URL" "$TMPDIR/pages" 2>/dev/null; then
            mkdir -p "$TMPDIR/pages"
            git -C "$TMPDIR/pages" init
            git -C "$TMPDIR/pages" checkout -b gh-pages
            git -C "$TMPDIR/pages" remote add origin "$REPO_URL"
          fi

          # Copy fresh output files
          cp pages-output/status.json "$TMPDIR/pages/"
          [ -f pages-output/status-log.jsonl ] && cp pages-output/status-log.jsonl "$TMPDIR/pages/" || true

          # Commit and force-push
          git -C "$TMPDIR/pages" config user.name "github-actions[bot]"
          git -C "$TMPDIR/pages" config user.email "github-actions[bot]@users.noreply.github.com"
          git -C "$TMPDIR/pages" add .
          git -C "$TMPDIR/pages" diff --staged --quiet || \
            git -C "$TMPDIR/pages" commit -m "chore: update deployment status"
          git -C "$TMPDIR/pages" push --force origin gh-pages

      - name: Fail if check failed
        if: steps.check.outcome == 'failure'
        run: exit 1
