name: PoDe check (reusable)
on:
  workflow_call:

concurrency:
  group: pode-run
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests irys-sdk

      - name: Run PoDe check
        id: check
        continue-on-error: true
        env:
          RENDER_API_KEY:     ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID:  ${{ secrets.RENDER_SERVICE_ID }}

          GITHUB_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
        run: python pode_check.py

      - name: Upload status to Arweave
        continue-on-error: true
        env:
          IRYS_PRIVATE_KEY: ${{ secrets.IRYS_PRIVATE_KEY }}
          IRYS_NETWORK:     ${{ secrets.IRYS_NETWORK }}
          IRYS_RPC_URL:     ${{ secrets.IRYS_RPC_URL }}
        run: python pode_arweave.py

      - name: Push status.json and log to gh-pages
        continue-on-error: true
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: pages-output
          clean: false
          commit-message: "chore: update deployment status"

      - name: Fail if check failed
        if: steps.check.outcome == 'failure'
        run: exit 1
