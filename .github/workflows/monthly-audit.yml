name: Monthly POIDE audit
on:
  schedule:
    - cron: '0 6 1 * *'  # 1st of each month at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests irys-sdk

      - name: Run monthly audit
        id: audit
        env:
          IRYS_PRIVATE_KEY: ${{ secrets.IRYS_PRIVATE_KEY }}
          IRYS_NETWORK:     ${{ secrets.IRYS_NETWORK }}
          IRYS_RPC_URL:     ${{ secrets.IRYS_RPC_URL }}
        run: |
          output=$(python monthly_audit.py)
          echo "$output"
          echo "month=$(echo "$output" | grep ^MONTH= | cut -d= -f2)" >> $GITHUB_OUTPUT
          echo "tx=$(echo "$output"    | grep ^TX=    | cut -d= -f2)" >> $GITHUB_OUTPUT
          echo "url=$(echo "$output"   | grep ^URL=   | cut -d= -f2)" >> $GITHUB_OUTPUT

      - name: Commit audit record
        run: |
          mkdir -p audit
          cat > audit/${{ steps.audit.outputs.month }}.md << 'EOF'
          # POIDE audit — ${{ steps.audit.outputs.month }}

          Arweave: ${{ steps.audit.outputs.url }}
          TX: ${{ steps.audit.outputs.tx }}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add audit/
          git diff --staged --quiet || git commit -m "chore: POIDE audit ${{ steps.audit.outputs.month }}"
          git push

      - name: Push monthly summary to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PYEOF'
          import base64, json, os
          import requests

          token = os.environ["GITHUB_TOKEN"]
          repo  = os.environ.get("GITHUB_REPOSITORY", "fxg55647/leima")
          month = "${{ steps.audit.outputs.month }}"
          tx    = "${{ steps.audit.outputs.tx }}"
          url   = "${{ steps.audit.outputs.url }}"

          data = json.dumps({"month": month, "tx": tx, "url": url}, indent=2).encode()
          content = base64.b64encode(data).decode()

          hdr = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"}
          api = f"https://api.github.com/repos/{repo}/contents/monthly-summary.json"
          r = requests.get(api, headers=hdr, params={"ref": "gh-pages"}, timeout=10)
          sha = r.json().get("sha") if r.status_code == 200 else None

          payload = {"message": "chore: update monthly summary", "content": content, "branch": "gh-pages"}
          if sha:
              payload["sha"] = sha
          r = requests.put(api, headers=hdr, json=payload, timeout=10)
          print("monthly-summary.json →", r.status_code)
          PYEOF
