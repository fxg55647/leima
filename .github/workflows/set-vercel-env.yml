name: Set Vercel env var (one-time)
on:
  workflow_dispatch:

jobs:
  set-env:
    runs-on: ubuntu-latest
    steps:
      - name: Add PRE_DEPLOY_TOKEN to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          PRE_DEPLOY_TOKEN: ${{ secrets.PRE_DEPLOY_TOKEN }}
        run: |
          PAYLOAD=$(jq -n \
            --arg key "PRE_DEPLOY_TOKEN" \
            --arg val "$PRE_DEPLOY_TOKEN" \
            --arg teamId "$VERCEL_TEAM_ID" \
            '[{key: $key, value: $val, type: "encrypted", target: ["production", "preview", "development"]}]')
          curl -s -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_TEAM_ID&upsert=true" \
            | jq '.created[0] | {key, target, type}'
