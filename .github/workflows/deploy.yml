name: Deploy to production
on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  actions: write
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: staging

      - name: Signal deploy incoming
        continue-on-error: true
        env:
          PRE_DEPLOY_TOKEN: ${{ secrets.PRE_DEPLOY_TOKEN }}
          LEIMA_URL: https://leima.io
        run: |
          curl -s --max-time 10 -X POST \
            -H "Authorization: Bearer $PRE_DEPLOY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"sha\":\"$GITHUB_SHA\"}" \
            "$LEIMA_URL/api/deploy-incoming" || true

      - name: Send pre-deploy signal
        continue-on-error: true
        env:
          PRE_DEPLOY_TOKEN: ${{ secrets.PRE_DEPLOY_TOKEN }}
          LEIMA_URL: https://leima.io
        run: |
          curl -s --max-time 10 -X POST \
            -H "Authorization: Bearer $PRE_DEPLOY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"sha\":\"$GITHUB_SHA\"}" \
            "$LEIMA_URL/api/pre-deploy" || true

      - name: Code review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run code_review.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref staging
          sleep 15
          RUN_ID=$(gh run list \
            --workflow code_review.yml \
            --repo "$GITHUB_REPOSITORY" \
            --branch staging \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')
          echo "Code review run: $RUN_ID"
          for i in $(seq 1 20); do
            sleep 30
            RESULT=$(gh run view "$RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --json status,conclusion \
              --jq '"status:\(.status) conclusion:\(.conclusion)"')
            echo "$RESULT"
            if echo "$RESULT" | grep -q "status:completed"; then
              if echo "$RESULT" | grep -q "conclusion:success"; then
                echo "Code review passed"
                exit 0
              else
                echo "Code review failed"
                exit 1
              fi
            fi
          done
          echo "Code review timed out after 10 minutes"
          exit 1

      - name: Merge to main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin
          git merge origin/main --no-edit || true
          git push origin HEAD:main

      - name: Wake up TREAD
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d '{"ref":"main"}' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/tread.yml/dispatches"
