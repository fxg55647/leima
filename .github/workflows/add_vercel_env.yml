name: Add KV env vars to Vercel
on:
  push:
    branches: [staging]
    paths: ['.github/workflows/add_vercel_env.yml']
jobs:
  add-env:
    runs-on: ubuntu-latest
    steps:
      - name: Update KV env vars
        run: |
          BASE="https://api.vercel.com/v10/projects/${{ secrets.VERCEL_PROJECT_ID }}/env"
          TEAM="teamId=${{ secrets.VERCEL_TEAM_ID }}"
          AUTH="Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}"

          # Hae olemassa olevat env var ID:t
          ENVS=$(curl -s "$BASE?$TEAM" -H "$AUTH")
          URL_ID=$(echo "$ENVS" | python -c "import sys,json; envs=json.load(sys.stdin)['envs']; print(next((e['id'] for e in envs if e['key']=='KV_REST_API_URL'),''))")
          TOKEN_ID=$(echo "$ENVS" | python -c "import sys,json; envs=json.load(sys.stdin)['envs']; print(next((e['id'] for e in envs if e['key']=='KV_REST_API_TOKEN'),''))")
          echo "URL_ID=$URL_ID TOKEN_ID=$TOKEN_ID"

          # Päivitä tai luo
          if [ -n "$URL_ID" ]; then
            curl -s -X PATCH "$BASE/$URL_ID?$TEAM" -H "$AUTH" -H "Content-Type: application/json" \
              -d '{"value":"https://integral-lion-142277.upstash.io","target":["production","preview","development"]}' | python -m json.tool
          fi
          if [ -n "$TOKEN_ID" ]; then
            curl -s -X PATCH "$BASE/$TOKEN_ID?$TEAM" -H "$AUTH" -H "Content-Type: application/json" \
              -d '{"value":"gQAAAAAAAivFAAIgcDE0ZTk4ODkzNjI3OTc0YTJlOTE5N2NiYjNlNGFiOTVjMA","target":["production","preview","development"]}' | python -m json.tool
          fi
