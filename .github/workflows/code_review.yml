name: POIDE Code Review
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  actions: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Leima code review
        env:
          LEIMA_URL: https://leima.io
          RULES_URL: https://gateway.irys.xyz/EenhCycs7RSe9thFKupexRMNkW3qriybLjN7Az4S9s4z
          CR_CHECK: |
            import sys, json, os
            with open('/tmp/cr_result.json') as f:
                try:
                    d = json.load(f)
                except Exception as e:
                    print(f'::warning title=Code review error::Invalid response from Leima: {e}')
                    sys.exit(0)
            if 'error' in d:
                print(f'::warning title=Code review error::{d["error"]}')
                sys.exit(0)
            compliant = d.get('compliant', False)
            tx_url = d.get('stamp', {}).get('url', '')
            status = 'COMPLIANT' if compliant else 'VIOLATION'
            summary_file = os.environ.get('GITHUB_STEP_SUMMARY', '')
            if summary_file:
                with open(summary_file, 'w') as f:
                    f.write(f'# Leima Code Review -- {status}\n\n')
                    if tx_url:
                        f.write(f'Arweave: {tx_url}\n\n')
                    f.write(f'```\n{d.get("verdict", "")}\n```\n')
            if not compliant:
                print(f'::error title=Policy violation::{d.get("verdict","")[:300]}')
            sys.exit(0 if compliant else 1)
        run: |
          RESULT=$(curl -s --max-time 300 -X POST \
            -H "Content-Type: application/json" \
            -d "{\"repo\":\"$GITHUB_REPOSITORY\",\"ref\":\"$GITHUB_SHA\",\"rules_url\":\"$RULES_URL\"}" \
            "$LEIMA_URL/api/code-review")
          echo "$RESULT"
          echo "$RESULT" > /tmp/cr_result.json
          python3 <<< "$CR_CHECK"

      - name: Deploy to Render and wait
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "RENDER_API_KEY or RENDER_SERVICE_ID secret not set"; exit 1
          fi

          deploy_and_wait() {
            HTTP_CODE=$(curl -s -o /tmp/render_resp.json -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{"clearCache":"do_not_clear"}' \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys")
            RESP=$(cat /tmp/render_resp.json)
            echo "Render HTTP $HTTP_CODE: $RESP"
            if [ "$HTTP_CODE" = "429" ]; then
              echo "Rate limited by Render — waiting 60s before retry"; sleep 60; return 1
            fi
            DEPLOY_ID=$(echo "$RESP" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('deploy',d).get('id',''))" 2>/dev/null || echo "")
            if [ -z "$DEPLOY_ID" ]; then
              echo "Deploy ID not in response — fetching latest deploy from API..."
              sleep 5
              DEPLOYS=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" \
                "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=1")
              DEPLOY_ID=$(echo "$DEPLOYS" | python3 -c "
import sys,json
deploys = json.load(sys.stdin)
if deploys:
    print(deploys[0].get('deploy',{}).get('id',''))
" 2>/dev/null || echo "")
            fi
            if [ -z "$DEPLOY_ID" ]; then
              echo "Could not find deploy ID"; return 1
            fi
            echo "Deploy ID: $DEPLOY_ID"
            for i in $(seq 1 40); do
              sleep 15
              DEPLOY_JSON=$(curl -s \
                -H "Authorization: Bearer $RENDER_API_KEY" \
                "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID")
              STATUS=$(echo "$DEPLOY_JSON" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('deploy',d).get('status','unknown'))")
              echo "Status: $STATUS"
              if [ "$STATUS" = "live" ]; then
                LIVE_COMMIT=$(echo "$DEPLOY_JSON" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('deploy',d).get('commit',{}).get('id',''))")
                echo "Live commit: $LIVE_COMMIT"
                echo "Expected:    $GITHUB_SHA"
                if [ -n "$LIVE_COMMIT" ] && [ "${LIVE_COMMIT}" != "${GITHUB_SHA}" ]; then
                  echo "Commit mismatch after deploy — Render is running a different commit"; return 1
                fi
                return 0
              fi
              if [ "$STATUS" = "deactivated" ] || [ "$STATUS" = "canceled" ] || [ "$STATUS" = "failed" ]; then
                echo "Deploy ended with status: $STATUS"; return 1
              fi
            done
            echo "Deploy timed out after 10 minutes"; return 1
          }

          if ! deploy_and_wait; then
            echo "First attempt failed, retrying in 30 seconds..."
            sleep 30
            deploy_and_wait
          fi

      - name: Wake up TREAD
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d '{"ref":"main"}' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/tread-a.yml/dispatches"
