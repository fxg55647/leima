name: POIDE Code Review
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  actions: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Leima code review
        env:
          LEIMA_URL: https://leima.io
          RULES_URL: https://gateway.irys.xyz/EenhCycs7RSe9thFKupexRMNkW3qriybLjN7Az4S9s4z
          CR_CHECK: |
            import sys, json, os
            with open('/tmp/cr_result.json') as f:
                try:
                    d = json.load(f)
                except Exception as e:
                    print(f'::warning title=Code review error::Invalid response from Leima: {e}')
                    sys.exit(0)
            if 'error' in d:
                print(f'::warning title=Code review error::{d["error"]}')
                sys.exit(0)
            compliant = d.get('compliant', False)
            tx_url = d.get('stamp', {}).get('url', '')
            status = 'COMPLIANT' if compliant else 'VIOLATION'
            summary_file = os.environ.get('GITHUB_STEP_SUMMARY', '')
            if summary_file:
                with open(summary_file, 'w') as f:
                    f.write(f'# Leima Code Review -- {status}\n\n')
                    if tx_url:
                        f.write(f'Arweave: {tx_url}\n\n')
                    f.write(f'```\n{d.get("verdict", "")}\n```\n')
            if not compliant:
                print(f'::error title=Policy violation::{d.get("verdict","")[:300]}')
            sys.exit(0 if compliant else 1)
        run: |
          RESULT=$(curl -s --max-time 300 -X POST \
            -H "Content-Type: application/json" \
            -d "{\"repo\":\"$GITHUB_REPOSITORY\",\"ref\":\"$GITHUB_SHA\",\"rules_url\":\"$RULES_URL\"}" \
            "$LEIMA_URL/api/code-review")
          echo "$RESULT"
          echo "$RESULT" > /tmp/cr_result.json
          python3 <<< "$CR_CHECK"

      - name: Deploy to Vercel and wait
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "VERCEL_TOKEN or VERCEL_DEPLOY_HOOK_URL secret not set"; exit 1
          fi

          PROJECT_ID=$(echo "$VERCEL_DEPLOY_HOOK_URL" | python3 -c "import sys,re;m=re.search(r'/deploy/(prj_[^/]+)/',sys.stdin.read());print(m.group(1) if m else '')")
          echo "Project ID: $PROJECT_ID"

          echo "Triggering Vercel deploy via hook..."
          HOOK_RESP=$(curl -s -X POST "$VERCEL_DEPLOY_HOOK_URL")
          echo "Hook response: $HOOK_RESP"
          JOB_STATE=$(echo "$HOOK_RESP" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('job',{}).get('state',''))" 2>/dev/null || echo "")
          if [ "$JOB_STATE" != "PENDING" ]; then
            echo "Hook did not return PENDING — deploy not triggered"; exit 1
          fi
          TRIGGER_TIME=$(date +%s)

          sleep 10
          for i in $(seq 1 16); do
            sleep 15
            DEPLOY_JSON=$(curl -s \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments?projectId=$PROJECT_ID&teamId=$VERCEL_TEAM_ID&limit=1")
            echo "Raw API response: $DEPLOY_JSON"
            DEPLOY_ID=$(echo "$DEPLOY_JSON" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['deployments'][0]['uid'] if d.get('deployments') else '')" 2>/dev/null || echo "")
            STATUS=$(echo "$DEPLOY_JSON" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['deployments'][0]['state'] if d.get('deployments') else 'unknown')" 2>/dev/null || echo "unknown")
            CREATED=$(echo "$DEPLOY_JSON" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['deployments'][0].get('createdAt',0)//1000 if d.get('deployments') else 0)" 2>/dev/null || echo "0")
            echo "Deploy ID: $DEPLOY_ID  Status: $STATUS  Created: $CREATED  Trigger: $TRIGGER_TIME"
            if [ "$CREATED" -lt "$TRIGGER_TIME" ]; then
              echo "Latest deploy is older than our trigger — waiting for new deploy to appear..."; continue
            fi
            if [ "$STATUS" = "READY" ]; then
              LIVE_COMMIT=$(echo "$DEPLOY_JSON" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['deployments'][0].get('meta',{}).get('githubCommitSha','') if d.get('deployments') else '')")
              echo "Live commit: $LIVE_COMMIT"
              echo "Expected:    $GITHUB_SHA"
              if [ -n "$LIVE_COMMIT" ] && [ "$LIVE_COMMIT" != "$GITHUB_SHA" ]; then
                echo "Commit mismatch after deploy"; exit 1
              fi
              echo "Deploy successful"
              exit 0
            fi
            if [ "$STATUS" = "ERROR" ] || [ "$STATUS" = "CANCELED" ]; then
              echo "Deploy ended with status: $STATUS"; exit 1
            fi
          done
          echo "Deploy timed out after 4 minutes"; exit 1

      - name: Wake up TREAD
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d '{"ref":"main"}' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/tread-a.yml/dispatches"
