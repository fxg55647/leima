name: POIDE Code Review
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  actions: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Leima code review
        env:
          LEIMA_URL: https://leima.io
          RULES_URL: https://gateway.irys.xyz/EenhCycs7RSe9thFKupexRMNkW3qriybLjN7Az4S9s4z
          CR_CHECK: |
            import sys, json, os
            with open('/tmp/cr_result.json') as f:
                try:
                    d = json.load(f)
                except Exception as e:
                    print(f'::warning title=Code review error::Invalid response from Leima: {e}')
                    sys.exit(0)
            if 'error' in d:
                print(f'::warning title=Code review error::{d["error"]}')
                sys.exit(0)
            compliant = d.get('compliant', False)
            tx_url = d.get('stamp', {}).get('url', '')
            status = 'COMPLIANT' if compliant else 'VIOLATION'
            summary_file = os.environ.get('GITHUB_STEP_SUMMARY', '')
            if summary_file:
                with open(summary_file, 'w') as f:
                    f.write(f'# Leima Code Review -- {status}\n\n')
                    if tx_url:
                        f.write(f'Arweave: {tx_url}\n\n')
                    f.write(f'```\n{d.get("verdict", "")}\n```\n')
            if not compliant:
                print(f'::error title=Policy violation::{d.get("verdict","")[:300]}')
            sys.exit(0 if compliant else 1)
        run: |
          RESULT=$(curl -s --max-time 300 -X POST \
            -H "Content-Type: application/json" \
            -d "{\"repo\":\"$GITHUB_REPOSITORY\",\"ref\":\"$GITHUB_SHA\",\"rules_url\":\"$RULES_URL\"}" \
            "$LEIMA_URL/api/code-review")
          echo "$RESULT"
          echo "$RESULT" > /tmp/cr_result.json
          python3 <<< "$CR_CHECK"

      - name: Deploy to Vercel and wait
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "VERCEL_TOKEN or VERCEL_PROJECT_ID secret not set"; exit 1
          fi

          echo "Triggering Vercel deploy for $GITHUB_SHA..."
          HTTP_CODE=$(curl -s -o /tmp/vercel_resp.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"$VERCEL_PROJECT_ID\",\"gitSource\":{\"type\":\"github\",\"repoId\":\"$GITHUB_REPOSITORY_ID\",\"ref\":\"main\",\"sha\":\"$GITHUB_SHA\"}}" \
            "https://api.vercel.com/v13/deployments")
          RESP=$(cat /tmp/vercel_resp.json)
          echo "Vercel HTTP $HTTP_CODE: $RESP"

          DEPLOY_ID=$(echo "$RESP" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('id',''))" 2>/dev/null || echo "")
          if [ -z "$DEPLOY_ID" ]; then
            echo "Could not get deployment ID from Vercel response"; exit 1
          fi
          echo "Deploy ID: $DEPLOY_ID"

          for i in $(seq 1 40); do
            sleep 15
            DEPLOY_JSON=$(curl -s \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/$DEPLOY_ID")
            STATUS=$(echo "$DEPLOY_JSON" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('status','unknown'))")
            echo "Status: $STATUS"
            if [ "$STATUS" = "READY" ]; then
              LIVE_COMMIT=$(echo "$DEPLOY_JSON" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('meta',{}).get('githubCommitSha',''))")
              echo "Live commit: $LIVE_COMMIT"
              echo "Expected:    $GITHUB_SHA"
              if [ -n "$LIVE_COMMIT" ] && [ "$LIVE_COMMIT" != "$GITHUB_SHA" ]; then
                echo "Commit mismatch after deploy"; exit 1
              fi
              echo "Deploy successful"
              exit 0
            fi
            if [ "$STATUS" = "ERROR" ] || [ "$STATUS" = "CANCELED" ]; then
              echo "Deploy ended with status: $STATUS"; exit 1
            fi
          done
          echo "Deploy timed out after 10 minutes"; exit 1

      - name: Wake up TREAD
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d '{"ref":"main"}' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/tread-a.yml/dispatches"
