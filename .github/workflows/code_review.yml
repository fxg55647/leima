name: POIDE Code Review
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  actions: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Leima code review
        env:
          LEIMA_URL: https://leima.io
          RULES_URL: https://gateway.irys.xyz/EenhCycs7RSe9thFKupexRMNkW3qriybLjN7Az4S9s4z
          CR_CHECK: |
            import sys, json, os
            with open('/tmp/cr_result.json') as f:
                try:
                    d = json.load(f)
                except Exception as e:
                    print(f'::warning title=Code review error::Invalid response from Leima: {e}')
                    sys.exit(0)
            if 'error' in d:
                print(f'::warning title=Code review error::{d["error"]}')
                sys.exit(0)
            compliant = d.get('compliant', False)
            tx_url = d.get('stamp', {}).get('url', '')
            status = 'COMPLIANT' if compliant else 'VIOLATION'
            summary_file = os.environ.get('GITHUB_STEP_SUMMARY', '')
            if summary_file:
                with open(summary_file, 'w') as f:
                    f.write(f'# Leima Code Review -- {status}\n\n')
                    if tx_url:
                        f.write(f'Arweave: {tx_url}\n\n')
                    f.write(f'```\n{d.get("verdict", "")}\n```\n')
            if not compliant:
                print(f'::error title=Policy violation::{d.get("verdict","")[:300]}')
            sys.exit(0 if compliant else 1)
        run: |
          RESULT=$(curl -s --max-time 300 -X POST \
            -H "Content-Type: application/json" \
            -d "{\"repo\":\"$GITHUB_REPOSITORY\",\"ref\":\"$GITHUB_SHA\",\"rules_url\":\"$RULES_URL\"}" \
            "$LEIMA_URL/api/code-review")
          echo "$RESULT"
          echo "$RESULT" > /tmp/cr_result.json
          python3 <<< "$CR_CHECK"

      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel --prod --token "$VERCEL_TOKEN" --yes

      - name: Wake up TREAD
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d '{"ref":"main"}' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/tread-a.yml/dispatches"
