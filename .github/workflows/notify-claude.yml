name: Notify Claude on failure

on:
  workflow_run:
    workflows: ["POIDE Code Review"]
    types: [completed]

jobs:
  notify:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'staging' }}
    runs-on: ubuntu-latest
    steps:
      - name: Send webhook to Claude
        env:
          HOOKDECK_URL: ${{ secrets.CLAUDE_WEBHOOK_URL }}
        run: |
          RUN_ID="${{ github.event.workflow_run.id }}"
          SHA="${{ github.event.workflow_run.head_sha }}"
          curl -s -X POST "$HOOKDECK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"event\":\"code_review_failed\",\"run_id\":\"$RUN_ID\",\"sha\":\"$SHA\",\"branch\":\"staging\",\"message\":\"code_review.yml feilasi stagingissa — SHA $SHA — aja: gh run view $RUN_ID --log-failed\"}"
