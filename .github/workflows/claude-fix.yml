name: Claude fixes code review failure

on:
  workflow_run:
    workflows: ["POIDE Code Review"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  claude-debug:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'staging' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Fetch failed run logs
        id: logs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          LOGS=$(gh run view "$RUN_ID" --log-failed 2>/dev/null | tail -100)
          echo "logs<<EOF" >> $GITHUB_OUTPUT
          echo "$LOGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Ask Claude to fix
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--max-turns 10"
          prompt: |
            The POIDE Code Review workflow failed on the staging branch (commit ${{ github.event.workflow_run.head_sha }}).

            Failed logs:
            ${{ steps.logs.outputs.logs }}

            Your task:
            1. Analyze the failure and identify the root cause.
            2. If the failure is in the "Merge to main" step (non-fast-forward push), do NOT attempt to fix it — comment on the run explaining that staging needs to be manually synced with main.
            3. If the failure is a Leima policy violation, analyze what rule was violated and make the minimal fix to bring the code into compliance.
            4. If you make code changes, create a pull request targeting the **staging** branch (not main).
            5. Do not modify .github/workflows/ files.
