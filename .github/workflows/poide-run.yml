name: POIDE check (reusable)
# WARNING: Do not add concurrency groups — causes queue bursts that trigger
# GitHub abuse detection and stop all scheduled runs for up to an hour.
# WARNING: Do not add "Fail if check failed" or sys.exit(1) — workflow must
# always exit 0 or GitHub will suspend the scheduled crons.
on:
  workflow_call:

permissions:
  contents: write
  pages: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests irys-sdk

      - name: Run POIDE check
        id: check
        continue-on-error: true
        env:
          RENDER_API_KEY:     ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID:  ${{ secrets.RENDER_SERVICE_ID }}

          GITHUB_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
        run: python poide_check.py

      - name: Upload status to Arweave
        continue-on-error: true
        env:
          IRYS_PRIVATE_KEY: ${{ secrets.IRYS_PRIVATE_KEY }}
          IRYS_NETWORK:     ${{ secrets.IRYS_NETWORK }}
          IRYS_RPC_URL:     ${{ secrets.IRYS_RPC_URL }}
        run: python poide_arweave.py

      - name: Push status.json and log to gh-pages
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python push_status.py

