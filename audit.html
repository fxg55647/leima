<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leima — POIDE audit log</title>
  <style>
    body { font-family: "Segoe UI", system-ui, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; color: #212529; }
    h1 { font-size: 1.2rem; font-weight: 700; margin-bottom: 0.25rem; }
    .sub { font-size: 0.82rem; color: #6c757d; margin-bottom: 1.5rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 2px solid #dee2e6; color: #6c757d; font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
    td { padding: 0.4rem 0.6rem; border-bottom: 1px solid #f1f3f5; vertical-align: middle; }
    tr:hover td { background: #f8f9fa; }
    .ok   { color: #2ecc71; font-weight: 700; }
    .fail { color: #e74c3c; font-weight: 700; }
    .warn { color: #f0a030; font-weight: 700; }
    code { font-family: "Segoe UI Mono", "Courier New", monospace; font-size: 0.8rem; }
    a { color: #0d6efd; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .loading { color: #6c757d; font-size: 0.9rem; margin-top: 2rem; }
    .pagination { display: flex; align-items: center; gap: 1rem; margin-bottom: 0.75rem; }
    .pagination button { background: #0d6efd; color: #fff; border: none; border-radius: 5px; padding: 0.3rem 0.9rem; font-size: 0.82rem; cursor: pointer; }
    .pagination button:disabled { background: #dee2e6; color: #adb5bd; cursor: default; }
    .pagination button:not(:disabled):hover { background: #0b5ed7; }
    .page-info { font-size: 0.8rem; color: #6c757d; }
    .monthly-box { font-size: 0.85rem; background: #f0f5ff; border: 1px solid #c7d7fa; border-radius: 6px; padding: 0.5rem 0.875rem; margin-bottom: 1.25rem; color: #212529; }
    .mismatch-box { font-size: 0.85rem; border-radius: 6px; padding: 0.5rem 0.875rem; margin-bottom: 1.25rem; }
    .mismatch-active { background: #fee2e2; border: 1px solid #fca5a5; color: #991b1b; font-weight: 600; }
    .mismatch-resolved { background: #f8f9fa; border: 1px solid #dee2e6; color: #495057; }
  </style>
</head>
<body>
  <h1>Leima — POIDE audit log</h1>
  <p class="sub">Every deployment integrity check, permanently recorded. Each entry links to its Arweave record. · <a href="https://github.com/fxg55647/leima/blob/main/audit.html" target="_blank" rel="noopener noreferrer">Page source</a></p>
  <div id="mismatch-status"></div>
  <div id="monthly-summary"></div>
  <div id="content"><p class="loading">Loading…</p></div>

  <script>
    const GATEWAY = 'https://gateway.irys.xyz';

    fetch('monthly-summary.json')
      .then(r => r.ok ? r.json() : null)
      .then(d => {
        if (!d || !d.month) return;
        const box = document.getElementById('monthly-summary');
        const a = document.createElement('a');
        a.href = d.url || (GATEWAY + '/' + d.tx);
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.textContent = d.tx ? d.tx.slice(0, 12) + '…' : d.url;
        const p = document.createElement('p');
        p.className = 'monthly-box';
        p.appendChild(document.createTextNode('Latest monthly Arweave summary (' + d.month + '): '));
        p.appendChild(a);
        box.appendChild(p);
      })
      .catch(() => {});

    function renderMismatchStatus(rows) {
      const box = document.getElementById('mismatch-status');
      // rows are newest-first; track last ok seen — when we hit a real mismatch,
      // that last ok is the resolution (the first ok after the mismatch in time).
      let mismatch = null, resolved = null, lastOk = null;
      for (const e of rows) {
        if (!mismatch) {
          if (e.deployment_ok === true) lastOk = e;
          else if (e.deployment_ok === false && !e.deploying) {
            mismatch = e;
            resolved = lastOk;
          }
        } else {
          break;
        }
      }
      if (!mismatch) return;

      function toDate(ts) {
        return new Date(ts.replace(' UTC', 'Z').replace(' ', 'T'));
      }
      function minsApart(a, b) {
        return Math.round(Math.abs(toDate(a.ts) - toDate(b.ts)) / 60000);
      }

      const p = document.createElement('p');
      if (!resolved) {
        p.className = 'mismatch-box mismatch-active';
        p.textContent = `⚠ Active commit mismatch since ${mismatch.ts} — commit ${mismatch.commit}. Users should pause until resolved.`;
      } else {
        const mins = minsApart(mismatch, resolved);
        p.className = 'mismatch-box mismatch-resolved';
        p.textContent = `Last commit mismatch: ${mismatch.ts} (commit ${mismatch.commit}) — resolved after ${mins} min at ${resolved.ts}.`;
      }
      box.replaceChildren(p);
    }

    const PAGE_SIZE = 100;
    let allRows = [];
    let currentPage = 0;

    function buildRow(e) {
      const tr = document.createElement('tr');

      const ts = tr.insertCell(); ts.textContent = e.ts || e.timestamp || '—';

      const cm = tr.insertCell();
      const commit = (e.commit || e.verified_commit || '').slice(0, 7);
      const code = document.createElement('code');
      code.textContent = commit || '—';
      cm.appendChild(code);

      const st = tr.insertCell();
      const ok = e.ok === true;
      const span = document.createElement('span');
      span.className = ok ? 'ok' : 'fail';
      span.textContent = ok ? '✓ OK' : '✗ Fail';
      st.appendChild(span);

      const rs = tr.insertCell();
      if (!ok) {
        const reasons = [];
        if (e.deploying) reasons.push('deploy in progress');
        else if (e.deployment_ok === false) reasons.push('commit mismatch');
        if (e.review_ok === false) reasons.push('review failed');
        if (e.cron_fresh === false) reasons.push('stale cron');
        if (e.disabled_workflows && e.disabled_workflows.length) reasons.push('workflow disabled');
        if (e.error) reasons.push(e.error.slice(0, 60));
        rs.textContent = reasons.join(', ') || '—';
        rs.style.color = '#e74c3c';
        rs.style.fontSize = '0.78rem';
      }

      const ds = tr.insertCell();
      ds.textContent = e.deploy_status || '—';

      const run = tr.insertCell();
      const runUrl = e.actions_run_url;
      if (runUrl) {
        const a = document.createElement('a');
        a.href = runUrl;
        a.textContent = e.actions_run_id || 'run';
        a.target = '_blank'; a.rel = 'noopener noreferrer';
        run.appendChild(a);
      } else {
        run.textContent = '—';
      }

      const ar = tr.insertCell();
      const tx = e.tx || e.arweave_tx;
      if (tx) {
        const a = document.createElement('a');
        a.href = GATEWAY + '/' + tx;
        a.textContent = tx.slice(0, 12) + '…';
        a.target = '_blank'; a.rel = 'noopener noreferrer';
        ar.appendChild(a);
      } else if (e.arweave_error) {
        const s = document.createElement('span');
        s.className = 'warn';
        s.title = e.arweave_error;
        s.textContent = '⚠ upload failed';
        ar.appendChild(s);
      } else {
        ar.textContent = '—';
      }

      return tr;
    }

    function renderPage(page) {
      currentPage = page;
      const totalPages = Math.ceil(allRows.length / PAGE_SIZE);
      const start = page * PAGE_SIZE;
      const slice = allRows.slice(start, start + PAGE_SIZE);

      const table = document.createElement('table');
      const thead = table.createTHead();
      const hr = thead.insertRow();
      ['Timestamp', 'Commit', 'Status', 'Reason', 'Deploy', 'Actions run', 'Arweave'].forEach(h => {
        const th = document.createElement('th');
        th.textContent = h;
        hr.appendChild(th);
      });
      const tbody = table.createTBody();
      slice.forEach(e => tbody.appendChild(buildRow(e)));

      function makeNav() {
        const nav = document.createElement('div');
        nav.className = 'pagination';
        const prevBtn = document.createElement('button');
        prevBtn.textContent = '← Newer';
        prevBtn.disabled = page === 0;
        prevBtn.onclick = () => { renderPage(page - 1); window.scrollTo(0, 0); };
        const info = document.createElement('span');
        info.className = 'page-info';
        info.textContent = `Page ${page + 1} of ${totalPages} (${allRows.length} entries)`;
        const nextBtn = document.createElement('button');
        nextBtn.textContent = 'Older →';
        nextBtn.disabled = page >= totalPages - 1;
        nextBtn.onclick = () => { renderPage(page + 1); window.scrollTo(0, 0); };
        nav.append(prevBtn, info, nextBtn);
        return nav;
      }

      document.getElementById('content').replaceChildren(makeNav(), table, makeNav());
    }

    fetch('status-log.jsonl')
      .then(r => {
        if (!r.ok) throw new Error('Failed to fetch status-log.jsonl');
        return r.text();
      })
      .then(text => {
        allRows = text.trim().split('\n')
          .filter(l => l.trim())
          .map(l => { try { return JSON.parse(l); } catch { return null; } })
          .filter(Boolean)
          .reverse();
        if (!allRows.length) {
          document.getElementById('content').textContent = 'No entries found.';
          return;
        }
        renderMismatchStatus(allRows);
        renderPage(0);
      })
      .catch(err => {
        const p = document.createElement('p');
        p.textContent = 'Could not load audit log: ' + err.message;
        document.getElementById('content').replaceChildren(p);
      });
  </script>
</body>
</html>
