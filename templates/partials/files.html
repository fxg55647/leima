<div class="files-section">
  <div class="files-row">
    <a class="file-btn" href="/download/{{ session_id }}/source" download="source.{{ source_ext }}">
      ⬇ source.{{ source_ext }}
    </a>
    {% if "pdf" in formats %}
    <a class="file-btn" href="/download/{{ session_id }}/verdict.pdf" download>
      ⬇ verdict.pdf
    </a>
    {% endif %}
    {% if "txt" in formats %}
    <a class="file-btn" href="/download/{{ session_id }}/verdict.txt" download>
      ⬇ verdict.txt
    </a>
    {% endif %}
    {% if "html" in formats %}
    <a class="file-btn" href="/download/{{ session_id }}/verdict.html" download>
      ⬇ verdict.html
    </a>
    {% endif %}
    {% if "json" in formats %}
    <a class="file-btn" href="/download/{{ session_id }}/verdict.json" download>
      ⬇ verdict.json
    </a>
    {% endif %}
    <a class="file-btn secondary" href="/download/{{ session_id }}/manifest.json" download>
      ⬇ manifest.json
    </a>
  </div>

  <div class="irys-row">
    <span class="irys-label">Stamp record on Arweave</span>
    <a class="irys-link" href="{{ irys_url }}" target="_blank">{{ irys_tx }}</a>
  </div>
</div>

<style>
  .files-section { margin-top: 0.25rem; }

  .files-row {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    margin-bottom: 0.75rem;
  }
  .file-btn {
    display: inline-block;
    background: #0d6efd;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 0.45rem 1rem;
    font-size: 0.875rem;
    font-family: "Segoe UI", system-ui, sans-serif;
    font-weight: 500;
    text-decoration: none;
    transition: background 0.15s;
  }
  .file-btn:hover { background: #0b5ed7; }
  .file-btn.secondary {
    background: #fff;
    color: #198754;
    border: 1px solid #198754;
  }
  .file-btn.secondary:hover { background: #f0fff4; }

  .irys-row {
    display: flex;
    flex-direction: column;
    gap: 0.15rem;
  }
  .irys-label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: #adb5bd;
    font-weight: 600;
  }
  .irys-link {
    font-family: "Segoe UI Mono", "Courier New", monospace;
    font-size: 0.78rem;
    color: #0d6efd;
    word-break: break-all;
    text-decoration: none;
  }
  .irys-link:hover { text-decoration: underline; }
</style>
