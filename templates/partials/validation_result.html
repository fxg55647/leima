<div class="val-card {% if all_ok %}val-ok{% else %}val-fail{% endif %}">
  <div class="val-title">
    {% if all_ok %}✓ All checks passed{% else %}✗ Validation failed{% endif %}
  </div>

  {% for r in results %}
  <div class="val-row">
    <span class="val-icon">{% if r.ok %}✓{% else %}✗{% endif %}</span>
    <div class="val-detail">
      <span class="val-label">{{ r.label }}</span>
      {% if not r.ok %}
      <code class="val-mismatch">Expected: {{ r.expected }}</code>
      <code class="val-mismatch">Got:      {{ r.actual }}</code>
      {% else %}
      <code class="val-match">{{ r.actual if r.actual else r.expected }}</code>
      {% endif %}
    </div>
  </div>
  {% endfor %}
</div>

<style>
  .val-card {
    border-radius: 6px;
    padding: 1rem;
    margin-top: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }
  .val-ok { background: #f0fff4; border: 1px solid #c3e6cb; }
  .val-fail { background: #fff5f5; border: 1px solid #f5c6cb; }

  .val-title {
    font-weight: 600;
    font-size: 0.95rem;
  }
  .val-ok .val-title { color: #198754; }
  .val-fail .val-title { color: #dc3545; }

  .val-row {
    display: flex;
    gap: 0.75rem;
    align-items: flex-start;
  }
  .val-icon {
    font-size: 1rem;
    min-width: 1.2rem;
    margin-top: 0.05rem;
  }
  .val-ok .val-icon { color: #198754; }
  .val-fail .val-icon { color: #dc3545; }

  .val-detail {
    display: flex;
    flex-direction: column;
    gap: 0.15rem;
    flex: 1;
  }
  .val-label {
    font-size: 0.8rem;
    font-weight: 600;
    color: #495057;
  }
  .val-match, .val-mismatch {
    font-family: "Segoe UI Mono", "Courier New", monospace;
    font-size: 0.72rem;
    word-break: break-all;
  }
  .val-match { color: #198754; }
  .val-mismatch { color: #dc3545; }
</style>
