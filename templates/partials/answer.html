<div class="card" style="margin-top: 0;">

  <div class="verdict-header">
    <div class="verdict-claim">{{ question }}</div>
    <div class="verdict-summary">{{ summary_verdict }}</div>
  </div>

  <div class="meta-row">
    <span class="meta-label">📄 {{ filename }}</span>
    <span class="meta-label">🕐 {{ timestamp }}</span>
  </div>

  {% for label, text in passes %}
  <div class="pass-block">
    <div class="pass-label">{{ label }}</div>
    <div class="answer-text">{{ text | md | safe }}</div>
  </div>
  {% endfor %}

  <div class="hash-block">
    <div class="hash-row">
      <span class="hash-label">Input SHA-256</span>
      <code class="hash-value">{{ input_hash }}</code>
    </div>
    <div class="hash-row">
      <span class="hash-label">Verdict PDF SHA-256</span>
      <code class="hash-value">{{ verdict_hash }}</code>
    </div>
  </div>

  <div id="gen-wrap-{{ session_id }}">
    <div id="fmt-{{ session_id }}" class="format-options" style="display:none">
      <label class="fmt-label"><input type="checkbox" name="formats" value="pdf" checked> PDF</label>
      <label class="fmt-label"><input type="checkbox" name="formats" value="txt"> TXT</label>
      <label class="fmt-label"><input type="checkbox" name="formats" value="html"> HTML</label>
      <label class="fmt-label"><input type="checkbox" name="formats" value="json"> JSON</label>
    </div>
    <div class="download-row">
      <button class="generate-btn"
        hx-post="/files/{{ session_id }}"
        hx-target="#files-{{ session_id }}"
        hx-swap="innerHTML"
        hx-include="#fmt-{{ session_id }}"
        hx-on::after-request="document.getElementById('gen-wrap-{{ session_id }}').remove()">
        ⬇ Generate files
      </button>
      <button type="button" class="options-btn"
        onclick="var e=document.getElementById('fmt-{{ session_id }}');e.style.display=e.style.display==='none'?'flex':'none'">
        ⚙ Options
      </button>
    </div>
  </div>

  <div id="files-{{ session_id }}"></div>

</div>

<style>
  .verdict-header {
    border-left: 3px solid #0d6efd;
    padding: 0.75rem 1rem;
    margin-bottom: 1.25rem;
    background: #f0f5ff;
    border-radius: 0 6px 6px 0;
  }
  .verdict-claim {
    font-size: 0.8rem;
    color: #6c757d;
    margin-bottom: 0.3rem;
    font-style: italic;
  }
  .verdict-summary {
    font-size: 1.05rem;
    font-weight: 600;
    color: #212529;
  }

  .meta-row {
    display: flex;
    gap: 1.5rem;
    margin-bottom: 1rem;
    flex-wrap: wrap;
  }
  .meta-label { font-size: 0.8rem; color: #6c757d; }

  .pass-block { margin-bottom: 1.25rem; }
  .pass-label {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: #adb5bd;
    margin-bottom: 0.35rem;
  }

  .answer-text {
    line-height: 1.7;
    color: #212529;
    font-size: 0.95rem;
    margin-bottom: 1.25rem;
  }
  .answer-text p { margin: 0 0 0.6em; }
  .answer-text ul, .answer-text ol { margin: 0 0 0.6em 1.25em; }
  .answer-text li { margin-bottom: 0.2em; }
  .answer-text strong { font-weight: 700; }

  .hash-block {
    background: #f8f9fa;
    border: 1px solid #dee2e6;
    border-radius: 6px;
    padding: 0.875rem 1rem;
    margin-bottom: 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }
  .hash-row { display: flex; flex-direction: column; gap: 0.15rem; }
  .hash-label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: #adb5bd;
    font-weight: 600;
  }
  .hash-value {
    font-family: "Segoe UI Mono", "Courier New", monospace;
    font-size: 0.78rem;
    color: #0d6efd;
    word-break: break-all;
  }

  .format-options {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    margin-bottom: 0.6rem;
    padding: 0.6rem 0.75rem;
    background: #f8f9fa;
    border: 1px solid #dee2e6;
    border-radius: 6px;
  }
  .fmt-label {
    font-size: 0.82rem;
    color: #495057;
    display: flex;
    align-items: center;
    gap: 0.3rem;
    cursor: pointer;
  }

  .download-row {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
  }

  .options-btn {
    background: #fff;
    color: #6c757d;
    border: 1px solid #dee2e6;
    border-radius: 6px;
    padding: 0.45rem 0.875rem;
    font-size: 0.875rem;
    font-family: "Segoe UI", system-ui, sans-serif;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  .options-btn:hover { border-color: #adb5bd; color: #212529; }

  .generate-btn {
    background: #0d6efd;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 0.45rem 1.1rem;
    font-size: 0.875rem;
    font-family: "Segoe UI", system-ui, sans-serif;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
  }
  .generate-btn:hover { background: #0b5ed7; }
</style>
