<div style="margin-bottom: 0.75rem; padding-bottom: 0.75rem; border-bottom: 1px solid #dee2e6;">
  <div style="font-size: 0.72rem; color: #adb5bd; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.1rem;">From</div>
  <div style="font-size: 0.82rem; color: #495057;">{{ msg.from }}</div>
</div>
<div style="margin-bottom: 0.75rem;">
  <div style="font-size: 0.72rem; color: #adb5bd; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.1rem;">Subject</div>
  <div style="font-size: 0.82rem; font-weight: 500; color: #212529;">{{ msg.subject }}</div>
</div>
<div style="margin-bottom: 0.75rem;">
  <div style="font-size: 0.72rem; color: #adb5bd; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.1rem;">Date</div>
  <div style="font-size: 0.8rem; color: #6c757d;">{{ msg.date }}</div>
</div>
<div style="font-size: 0.82rem; line-height: 1.6; white-space: pre-wrap; color: #212529; border-top: 1px solid #dee2e6; padding-top: 0.75rem;">{{ msg.body }}</div>
